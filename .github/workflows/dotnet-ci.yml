name: RaceDay - Build, Test and Publish

# Runs on every push (any branch) and on pull requests
on:
  push:
  pull_request:

env:
  # Must match <TargetFramework> in the .csproj files (net10.0 -> 10.0.x)
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore API, MVC and tests
        run: dotnet restore RaceDay.Api.slnx

      - name: Build solution
        run: dotnet build RaceDay.Api.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test RaceDay.Api.test/RaceDay.Api.test.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Publish MVC application
        run: >
          dotnet publish RaceDay.Mvc/RaceDay.Mvc.csproj
          --no-build --configuration Release
          --output ./artifacts/mvc

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Upload MVC publish output
        uses: actions/upload-artifact@v4
        with:
          name: raceday-mvc
          path: ./artifacts/mvc
