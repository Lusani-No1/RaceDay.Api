name: Part 2 - Build and Test API

# Runs on every push (any branch) and on pull requests
on:
  push:
  pull_request:

env:
  # Must match <TargetFramework> in your .csproj files (net10.0 -> 10.0.x)
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        # The folder that contains your .sln file, relative to the repo root.
        # Use '.' if the .sln is in the repo root, or e.g. 'Part2' if it is in a Part2 folder.
        working-directory: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
